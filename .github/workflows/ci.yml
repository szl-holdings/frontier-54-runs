name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Parse mirrored Python and JSON evidence
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          root = Path(".")
          python_files = sorted(root.rglob("*.py"))
          json_files = sorted(root.rglob("*.json"))
          if not python_files or not json_files:
              raise SystemExit("Expected mirrored Python and JSON evidence")
          for path in python_files:
              ast.parse(path.read_text(encoding="utf-8-sig"), filename=str(path))
          for path in json_files:
              json.loads(path.read_text(encoding="utf-8-sig"))
          print(f"Validated {len(python_files)} Python and {len(json_files)} JSON files")
          PY
